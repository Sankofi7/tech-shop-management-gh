<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-4" style="max-width: 700px">
  <h1 class="h3">{{ title }}</h1><p>Sale {{ sale.reference }} · Sale allocated outstanding balance: GH₵{{ sale.outstanding_balance|floatformat:2 }}</p>
  <p>MTN Mobile Money amounts remain pending and do not count as received until a manager records confirmation.</p>
  <form method="post" class="card card-body">{% csrf_token %}{{ form.as_p }}<div class="d-flex gap-2"><button class="btn btn-primary">Record payment</button><a class="btn btn-outline-secondary" href="{% url 'sales:receipt' sale.pk %}">Cancel</a></div></form>
</main></body></html>
